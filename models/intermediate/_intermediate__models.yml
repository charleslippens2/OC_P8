version: 2

# Modèles intermédiaires — agrégations par dimension à partir du staging
# Chaque modèle calcule les indicateurs d'une dimension sociodémographique
# et alimente un ou plusieurs graphiques du support de présentation

models:
  - name: int_students_by_year
    description: >-
      Effectifs et répartition genre par année. Comptage total,
      étudiants distincts, répartition M/F/NR, taux de non-réponse,
      % femmes parmi les répondants. Alimente le graphique barres slide 8
      et les constats (4647 inscriptions, 568 réinscriptions).
    columns:
      - name: year_started
        description: Année d'inscription (une ligne par année)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024, 2025]
      - name: nb_students
        description: Nombre total d'inscriptions dans l'année
        data_tests:
          - not_null

  - name: int_age_distribution
    description: >-
      Distribution par tranche d'âge et par année, avec pourcentage,
      rang (RANK) et âge moyen estimé par point milieu de tranche.
      Utilisé en backup oral pour confirmer la stabilité du profil
      (30-34 ans domine chaque année) et le rajeunissement
      (âge moyen : 38 ans en 2022 → 35 ans en 2025).
    columns:
      - name: year_started
        description: Année d'inscription
        data_tests:
          - not_null
      - name: pct_of_year
        description: Pourcentage de la tranche dans l'année (somme = 100%)
        data_tests:
          - not_null

  - name: int_region_distribution
    description: >-
      Répartition géographique par année avec rang (RANK).
      Utilisé en backup oral pour montrer l'évolution de la
      concentration IDF par année (44,9% en 2022, pic 54,1%
      en 2023, retour à ~41% en 2024-2025).
    columns:
      - name: year_started
        description: Année d'inscription
        data_tests:
          - not_null
      - name: region
        description: Région de résidence (13 régions métro + DROM)
        data_tests:
          - not_null

  - name: int_gender_evolution
    description: >-
      Évolution du genre par année en format long : une ligne par
      modalité (M, F, Non renseigné) par année. Calcule les effectifs,
      le pourcentage sur le total, et le % parmi les répondants M/F.
      Alimente le graphique empilé 100% de la slide 9.
      Constat clé : le taux de non-réponse chute de 42% à 7%,
      mais le ratio femmes parmi les répondants reste stable ~31%.
    columns:
      - name: gender
        description: "Genre : M, F, ou Non renseigné (après nettoyage staging)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F', 'Non renseigné']