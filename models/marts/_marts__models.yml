version: 2
models:
  - name: mart_sociodemographic
    columns:
      - name: year_started
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024, 2025]
      - name: nb_students
        data_tests: [not_null]
  - name: mart_comparison_insee
    columns:
      - name: dimension
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['region', 'genre', 'age']
- name: mart_livrable_csv
    description: "Export consolidé de tous les indicateurs pour le livrable CSV. Slides 8-9 depuis les intermediates, slides 10-11-12 depuis mart_comparison_insee, slide 14 depuis mart_sociodemographic."