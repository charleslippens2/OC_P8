version: 2

models:
  - name: mart_sociodemographic
    description: >-
      Synthèse annuelle pour la direction : une ligne par année avec
      le top région, le top tranche d'âge, et le % IDF.
      Joint les 4 modèles intermédiaires. Alimente la slide 16
      (recommandations) avec les tendances par année.
    columns:
      - name: year_started
        description: Année d'inscription (2022 à 2025, une ligne par année)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024, 2025]
      - name: nb_students
        description: Nombre total d'inscriptions dans l'année
        data_tests:
          - not_null

  - name: mart_comparison_insee
    description: >-
      Modèle pivot du projet : croise le profil OC (toutes années)
      avec la population INSEE 2023 sur 3 dimensions (région, genre, âge).
      Structure UNION ALL — ~25 lignes avec pct_oc, pct_insee, ecart_pts.
      Lit les staging directement (pas les intermédiaires) car la
      comparaison est globale, pas par année.
      Alimente les slides 10 (âge), 12 (géo), 14 (tableau) et 16 (synthèse).
    columns:
      - name: dimension
        description: "Axe de comparaison : region, genre ou age"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['region', 'genre', 'age']

  - name: mart_livrable_csv
    description: >-
      Modèle utilitaire d'export — consolide tous les indicateurs
      en un seul fichier CSV livrable. 7 blocs étiquetés par
      numéro de slide (S08_ à S14_S16_). Ne fait aucun calcul,
      juste un assemblage UNION ALL des intermédiaires et du mart.
      Filtrable par source_table pour retrouver les données
      de chaque graphique du support de présentation.
      Cellules vides marquées N/A quand la colonne ne s'applique pas
      au bloc concerné.
    columns:
      - name: slide
        description: Numéro de la slide alimentée par ce bloc
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [8, 9, 10, 11, 12, 13, 14]
      - name: source_table
        description: >-
          Identifiant du bloc — permet de filtrer le CSV
          pour retrouver les données d'une slide spécifique.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'S08_effectifs_par_annee'
                  - 'S09_parite_homme_femme'
                  - 'S10_distribution_age'
                  - 'S11_evolution_age_top5'
                  - 'S12_repartition_geographique'
                  - 'S13_evolution_pct_idf'
                  - 'S14_S16_comparaison_insee_synthese'
      - name: dimension
        description: "Année (slides 8-9, 11, 13) ou 'global' (slides 10, 12) ou dimension INSEE (slide 14)"
        data_tests:
          - not_null
      - name: rang
        description: Ordre d'affichage dans le graphique
        data_tests:
          - not_null