version: 2

# Tests et documentation des modèles staging
# Ces tests portent sur les données APRÈS nettoyage (stg_), pas sur les sources brutes
models:
  - name: stg_students
    description: >-
      Table étudiants nettoyée à partir de OC_P8.RAW.STUDENTS.
      Nettoyages appliqués : TRIM sur les colonnes texte, genre vide recodé
      en 'Non renseigné' (choix RGPD art. 9 — pas d'imputation),
      USER_ID conservé tel quel (déjà pseudonymisé en amont par OC).
      Les 568 doublons USER_ID sont des réinscriptions sur plusieurs années,
      pas des erreurs — clé unique retenue : USER_ID + year_started.
    columns:
      - name: USER_ID
        description: >-
          Identifiant pseudonymisé (hash fourni par OC).
          Donnée personnelle indirecte au sens du RGPD.
          Pas de test unique car un même étudiant peut apparaître
          sur plusieurs années (réinscriptions). L'unicité USER_ID + année
          est vérifiée dans le test custom unique_student_year.
        data_tests:
          - not_null

      - name: gender
        description: >-
          Genre déclaré par l'étudiant (M, F, ou Non renseigné).
          Donnée sensible au sens de l'art. 9 du RGPD — utilisée
          uniquement pour l'analyse de parité dans un cadre d'égalité
          des chances. Les valeurs vides (~27% du dataset) sont conservées
          comme 'Non renseigné' plutôt qu'imputées, pour ne pas fausser
          les indicateurs de parité.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F', 'Non renseigné']

      - name: year_started
        description: Année de début du parcours (2022 à 2025)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023, 2024, 2025]

      - name: age_group
        description: >-
          Tranche d'âge quinquennale (20-24 ans, 25-29 ans, etc.).
          On utilise des tranches et non l'âge exact — principe de
          minimisation RGPD.
        data_tests:
          - not_null

      - name: region
        description: >-
          Région de résidence. Granularité régionale uniquement,
          pas d'adresse ni de département (minimisation RGPD).
          13 régions métropolitaines + DROM regroupés.
        data_tests:
          - not_null